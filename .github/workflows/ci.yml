name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from lockfile without lifecycle side effects
        run: npm ci --ignore-scripts --omit=optional
      - name: Run all guards (includes metadata drift)
        run: node scripts/check-all.mjs

  native-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from lockfile without lifecycle side effects
        run: npm ci --ignore-scripts --omit=optional
      - name: Verify native package lifecycle and provenance
        run: node --test scripts/lib/__tests__/npm-lifecycle.test.mjs scripts/lib/__tests__/package-lifecycle.test.mjs scripts/lib/__tests__/package-provenance.test.mjs
